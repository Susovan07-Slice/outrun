<!doctype html>
<html lang="en" class="is-booting">
  <head>
    <link rel="icon" type="image/png" href="./imgs/outrun-logo-mark.png" />
    <meta charset="utf-8" />
    <title>Outrun — Global Climate-Pressure & Corridor Platform for Migratory Birds</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#efe9dd" />
    <meta
      name="description"
      content="Outrun: A global climate-pressure and corridor platform for migratory birds (class Aves). Tracking climate velocity, seasonal habitat shifts, and critical migratory corridors."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link href="https://unpkg.com/maplibre-gl@4.5.2/dist/maplibre-gl.css" rel="stylesheet" />
    <!-- Loading screen: painted before the app bundle arrives; src/bootLoader.js drives it. -->
    <style>
      html.is-booting, html.is-booting body { overflow: hidden; }
      #boot {
        position: fixed; inset: 0; z-index: 10000;
        display: grid; place-items: center;
        background: radial-gradient(900px 600px at 50% 40%, #f7f2e7 0%, #ece5d7 60%, #e2d9c7 100%);
        color: #16181d;
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition: opacity 560ms cubic-bezier(0.22, 1, 0.36, 1), visibility 0s linear 560ms;
      }
      #boot.is-done { opacity: 0; visibility: hidden; }
      #boot .boot__inner { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 24px; text-align: center; width: min(440px, 100%); }

      /* ---- Sketch bird ---- */
      #boot .boot__sky { position: relative; width: min(320px, 78vw); aspect-ratio: 240 / 170; }
      #boot .boot__sky svg { width: 100%; height: 100%; overflow: visible; }
      #boot .ink { fill: none; stroke: #16181d; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      #boot .ink--soft { stroke-width: 1.2; opacity: 0.45; }
      #boot .ink--hatch { stroke-width: 1; opacity: 0.5; }
      #boot .paper { fill: #f6f1e6; }
      #boot .boot__bird { animation: boot-bob 0.84s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
      #boot .boot__wing {
        transform-box: view-box;
        transform-origin: 122px 80px;
        animation: boot-flap 0.84s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      #boot .boot__wing--far { animation-delay: -0.06s; opacity: 0.55; }
      #boot .boot__wind path { stroke-dasharray: 10 14; animation: boot-wind 0.9s linear infinite; }
      /* Downstroke is the power stroke: the wing sweeps from raised to lowered (seen
         foreshortened, so it flips through flat), and the body rises a little as it does. */
      @keyframes boot-flap {
        0%   { transform: rotate(-6deg) scaleY(1); }
        45%  { transform: rotate(4deg) scaleY(-0.72); }
        60%  { transform: rotate(3deg) scaleY(-0.78); }
        100% { transform: rotate(-6deg) scaleY(1); }
      }
      @keyframes boot-bob {
        0%, 100% { transform: translateY(3px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes boot-wind { to { stroke-dashoffset: 48; } }

      /* ---- Title + hand-drawn progress line ---- */
      #boot .boot__title { margin-top: 4px; font: 800 22px/1 Outfit, Inter, system-ui, sans-serif; letter-spacing: 0.32em; padding-left: 0.32em; }
      #boot .boot__sub { font-size: 13px; color: #4e5563; }
      #boot .boot__line { width: min(300px, 76vw); height: 22px; margin-top: 12px; overflow: visible; }
      #boot .boot__line path { fill: none; stroke-linecap: round; stroke-width: 2.4; }
      #boot .boot__line .track { stroke: rgba(22, 24, 29, 0.14); stroke-dasharray: 2 7; }
      #boot #boot-ring { stroke: #16181d; stroke-dasharray: 100; stroke-dashoffset: 100; transition: stroke-dashoffset 520ms cubic-bezier(0.22, 1, 0.36, 1); }
      #boot .boot__status { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 18px; font: 500 12px/1.3 'JetBrains Mono', ui-monospace, Consolas, monospace; color: #4e5563; }
      #boot #boot-pct { color: #16181d; font-weight: 600; }
      #boot #boot-src { min-height: 16px; font: 500 11px/1.3 'JetBrains Mono', ui-monospace, Consolas, monospace; color: #7b8191; }
      #boot #boot-src.is-live { color: #0f7f6d; }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot__bird, #boot .boot__wing, #boot .boot__wind path { animation: none; }
        #boot, #boot #boot-ring { transition: none; }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run Outrun.</noscript>
    <div id="boot" role="progressbar" aria-label="Loading Outrun" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="boot__inner">
        <div class="boot__sky" aria-hidden="true">
          <svg viewBox="0 0 240 170">
            <defs>
              <!-- Pencil wobble: a little noise displaces every stroke so lines look hand-drawn. -->
              <filter id="boot-pencil" x="-10%" y="-10%" width="120%" height="120%">
                <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" />
                <feDisplacementMap in="SourceGraphic" scale="2.6" />
              </filter>
            </defs>

            <!-- Wind streaks behind the bird -->
            <g class="boot__wind ink ink--soft">
              <path d="M8 70 H 40" />
              <path d="M2 100 H 46" />
              <path d="M18 128 H 52" />
            </g>

            <g class="boot__bird" filter="url(#boot-pencil)">
              <!-- Far wing (behind the body) -->
              <g class="boot__wing boot__wing--far" transform="translate(10 -4)">
                <path class="paper" d="M122 80 C 112 52, 98 30, 70 12 C 92 15, 118 30, 138 56 C 142 63, 140 73, 134 82 Z" />
                <path class="ink" d="M122 80 C 112 52, 98 30, 70 12 C 92 15, 118 30, 138 56 C 142 63, 140 73, 134 82" />
              </g>

              <!-- Body, tail, head and beak -->
              <path class="paper" d="M62 88 C 84 76, 122 70, 152 73 C 166 74, 178 70, 188 66 C 196 63, 203 66, 206 70 C 202 79, 190 85, 172 88 C 142 94, 104 98, 72 95 Z" />
              <path class="ink" d="M62 88 C 84 76, 122 70, 152 73 C 166 74, 178 70, 188 66 C 196 63, 203 66, 206 70" />
              <path class="ink" d="M206 70 C 202 79, 190 85, 172 88 C 142 94, 104 98, 72 95 L 62 88" />
              <path class="ink ink--soft" d="M66 86 C 92 78, 124 74, 150 76" />
              <path class="ink" d="M62 88 L 32 76 L 46 90 L 30 104 L 72 95" />
              <path class="ink ink--soft" d="M44 82 L 60 89 M 42 98 L 62 93" />
              <path class="ink" d="M205 68 L 226 72 L 205 74" />
              <circle cx="196" cy="68" r="1.8" fill="#16181d" />
              <path class="ink ink--hatch" d="M96 92 L 104 86 M 108 93 L 116 86 M 120 93 L 128 86 M 132 92 L 140 85 M 144 90 L 152 84" />
              <!-- Legs tucked back -->
              <path class="ink ink--soft" d="M118 94 L 98 104 M 124 95 L 104 106" />

              <!-- Near wing (over the body): outline, feather tips and hatching -->
              <g class="boot__wing">
                <path class="paper" d="M122 80 C 112 52, 98 30, 70 12 C 92 15, 118 30, 138 56 C 142 63, 140 73, 134 82 Z" />
                <path class="ink" d="M122 80 C 112 52, 98 30, 70 12 C 92 15, 118 30, 138 56 C 142 63, 140 73, 134 82" />
                <path class="ink" d="M70 12 L 60 6 M 78 15 L 66 11 M 87 19 L 76 17 M 96 24 L 86 23" />
                <path class="ink ink--soft" d="M118 70 C 112 54, 104 42, 90 30 M 128 68 C 122 54, 114 44, 102 34" />
                <path class="ink ink--hatch" d="M112 56 L 120 50 M 106 46 L 114 41 M 100 37 L 107 33" />
              </g>
            </g>
          </svg>
        </div>

        <div class="boot__title">OUTRUN</div>
        <div class="boot__sub">Migratory flyway observatory</div>

        <!-- Hand-drawn flight line: draws in as each loading step completes -->
        <svg class="boot__line" viewBox="0 0 300 22" aria-hidden="true">
          <path class="track" d="M4 14 C 50 4, 90 20, 150 11 C 210 2, 250 18, 296 9" />
          <path id="boot-ring" pathLength="100" d="M4 14 C 50 4, 90 20, 150 11 C 210 2, 250 18, 296 9" filter="url(#boot-pencil)" />
        </svg>
        <div class="boot__status"><span id="boot-step">Starting…</span><span id="boot-pct">0%</span></div>
        <div id="boot-src"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="./src/index.jsx"></script>
  </body>
</html>
