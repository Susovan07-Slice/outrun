<!doctype html>
<html lang="en" class="is-booting">
  <head>
    <link rel="icon" type="image/png" href="./imgs/outrun-logo-mark.png" />
    <meta charset="utf-8" />
    <title>Outrun — Global Climate-Pressure & Corridor Platform for Migratory Birds</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5dcc7" />
    <meta
      name="description"
      content="Outrun: A global climate-pressure and corridor platform for migratory birds (class Aves). Tracking climate velocity, seasonal habitat shifts, and critical migratory corridors."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&family=Fraunces:opsz,wght@9..144,600..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link href="https://unpkg.com/maplibre-gl@4.5.2/dist/maplibre-gl.css" rel="stylesheet" />
    <!-- Loading screen: painted before the app bundle arrives; src/bootLoader.js drives it. -->
    <style>
      html.is-booting, html.is-booting body { overflow: hidden; }
      #boot {
        position: fixed; inset: 0; z-index: 10000;
        display: grid; place-items: center;
        background: radial-gradient(900px 600px at 50% 40%, #fef4eb 0%, #f6dfca 55%, #ebc7a9 100%);
        color: #2b1b12;
        font-family: Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition: opacity 560ms cubic-bezier(0.22, 1, 0.36, 1), visibility 0s linear 560ms;
      }
      #boot.is-done { opacity: 0; visibility: hidden; }
      #boot .boot__inner { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 24px; text-align: center; width: min(440px, 100%); }

      /* ---- Line-icon bird ----
         One even stroke weight, rounded caps and joins, no shading: the same drawing
         language as the app's icons. Fills match the backdrop so the near wing hides the body. */
      #boot .boot__sky { position: relative; width: min(320px, 78vw); aspect-ratio: 240 / 170; }
      #boot .boot__sky svg { width: 100%; height: 100%; overflow: visible; }
      #boot .ink { fill: none; stroke: #2b1b12; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
      #boot .paper { fill: #fbecdf; }
      #boot .boot__bird { animation: boot-bob 0.84s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
      #boot .boot__wing {
        transform-box: view-box;
        transform-origin: 122px 80px;
        animation: boot-flap 0.84s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      #boot .boot__wing--far { animation-delay: -0.06s; opacity: 0.35; }
      /* Downstroke is the power stroke: the wing sweeps from raised to lowered (seen
         foreshortened, so it flips through flat), and the body rises a little as it does. */
      @keyframes boot-flap {
        0%   { transform: rotate(-6deg) scaleY(1); }
        45%  { transform: rotate(4deg) scaleY(-0.72); }
        60%  { transform: rotate(3deg) scaleY(-0.78); }
        100% { transform: rotate(-6deg) scaleY(1); }
      }
      @keyframes boot-bob {
        0%, 100% { transform: translateY(3px); }
        50% { transform: translateY(-5px); }
      }

      /* ---- Air flowing past ----
         Streamlines run from the beak back past the tail, bending over the wing and under
         the body; a short dash travels along each one and fades at both ends. */
      #boot .boot__air path {
        fill: none;
        stroke: #2b1b12;
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-dasharray: 22 300;
        stroke-dashoffset: 22;
        opacity: 0;
        animation: boot-air 1.5s linear infinite;
      }
      #boot .boot__air path:nth-child(2) { animation-duration: 1.25s; animation-delay: -0.5s; }
      #boot .boot__air path:nth-child(3) { animation-duration: 1.4s; animation-delay: -0.9s; }
      #boot .boot__air path:nth-child(4) { animation-duration: 1.7s; animation-delay: -0.3s; }
      #boot .boot__air path:nth-child(5) { animation-duration: 1.1s; animation-delay: -0.7s; stroke-width: 1.8; }
      #boot .boot__wake path {
        fill: none;
        stroke: #2b1b12;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-dasharray: 40 100;
        stroke-dashoffset: 40;
        opacity: 0;
        animation: boot-wake 1.68s ease-out infinite;
      }
      #boot .boot__wake path:nth-child(2) { animation-delay: -0.84s; }
      @keyframes boot-air {
        0%   { stroke-dashoffset: 22; opacity: 0; }
        15%  { opacity: 0.45; }
        80%  { opacity: 0.3; }
        100% { stroke-dashoffset: -100; opacity: 0; }
      }
      @keyframes boot-wake {
        0%   { stroke-dashoffset: 40; opacity: 0; }
        25%  { opacity: 0.4; }
        100% { stroke-dashoffset: -60; opacity: 0; }
      }

      /* ---- Title + progress line ---- */
      #boot .boot__title { margin-top: 4px; font: 750 23px/1 'Bricolage Grotesque', system-ui, sans-serif; letter-spacing: 0.3em; padding-left: 0.3em; }
      #boot .boot__sub { font-size: 13px; color: #664a37; }
      #boot .boot__line { width: min(300px, 76vw); height: 22px; margin-top: 12px; overflow: visible; }
      #boot .boot__line path { fill: none; stroke-linecap: round; stroke-width: 3; }
      #boot .boot__line .track { stroke: rgba(22, 24, 29, 0.14); stroke-dasharray: 2 7; }
      #boot #boot-ring { stroke: #2b1b12; stroke-dasharray: 100; stroke-dashoffset: 100; transition: stroke-dashoffset 520ms cubic-bezier(0.22, 1, 0.36, 1); }
      #boot .boot__status { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 18px; font: 500 12px/1.3 'IBM Plex Mono', ui-monospace, Consolas, monospace; color: #664a37; }
      #boot #boot-pct { color: #2b1b12; font-weight: 600; }
      #boot #boot-src { min-height: 16px; font: 500 11px/1.3 'IBM Plex Mono', ui-monospace, Consolas, monospace; color: #86644e; }
      #boot #boot-src.is-live { color: #8a3a1f; }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot__bird, #boot .boot__wing { animation: none; }
        #boot .boot__air, #boot .boot__wake { display: none; }
        #boot, #boot #boot-ring { transition: none; }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run Outrun.</noscript>
    <div id="boot" role="progressbar" aria-label="Loading Outrun" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="boot__inner">
        <div class="boot__sky" aria-hidden="true">
          <svg viewBox="0 0 240 170">
            <!-- Air streaming back past the bird (paths run beak -> tail, so dashes travel backwards) -->
            <g class="boot__air">
              <path pathLength="100" d="M236 34 C 196 30, 160 14, 112 8 C 74 4, 38 12, 4 18" />
              <path pathLength="100" d="M236 58 C 210 56, 186 50, 150 48 C 108 46, 60 54, 4 56" />
              <path pathLength="100" d="M236 112 C 200 110, 168 106, 126 110 C 84 114, 44 110, 4 106" />
              <path pathLength="100" d="M236 140 C 192 138, 150 132, 108 136 C 68 140, 36 136, 4 132" />
              <path pathLength="100" d="M232 84 C 222 84, 216 82, 210 80" />
            </g>
            <!-- Small curls of air shed behind the tail -->
            <g class="boot__wake">
              <path pathLength="100" d="M34 82 C 22 78, 12 84, 16 92 C 19 98, 28 96, 27 90" />
              <path pathLength="100" d="M32 102 C 20 106, 12 100, 16 94" />
            </g>

            <g class="boot__bird">
              <!-- Far wing (behind the body) -->
              <g class="boot__wing boot__wing--far" transform="translate(10 -4)">
                <path class="paper ink" d="M122 80 C 112 52, 98 30, 70 12 C 92 15, 118 30, 138 56 C 142 63, 140 73, 134 82" />
              </g>

              <!-- Body with tail, beak and eye -->
              <path class="paper ink" d="M62 88 C 84 76, 122 70, 152 73 C 166 74, 178 70, 188 66 C 196 63, 203 66, 206 70 C 202 79, 190 85, 172 88 C 142 94, 104 98, 72 95 Z" />
              <path class="ink" d="M62 88 L 34 76 L 46 91 L 32 104 L 72 95" />
              <path class="ink" d="M206 69 L 224 72 L 205 75" />
              <circle cx="194" cy="70" r="2.6" fill="#2b1b12" />

              <!-- Near wing (over the body) -->
              <g class="boot__wing">
                <path class="paper ink" d="M122 80 C 112 52, 98 30, 70 12 C 92 15, 118 30, 138 56 C 142 63, 140 73, 134 82" />
              </g>
            </g>
          </svg>
        </div>

        <div class="boot__title">OUTRUN</div>
        <div class="boot__sub">Migratory flyway observatory</div>

        <!-- Flight line: draws in as each loading step completes -->
        <svg class="boot__line" viewBox="0 0 300 22" aria-hidden="true">
          <path class="track" d="M4 14 C 50 4, 90 20, 150 11 C 210 2, 250 18, 296 9" />
          <path id="boot-ring" pathLength="100" d="M4 14 C 50 4, 90 20, 150 11 C 210 2, 250 18, 296 9" />
        </svg>
        <div class="boot__status"><span id="boot-step">Starting…</span><span id="boot-pct">0%</span></div>
        <div id="boot-src"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="./src/index.jsx"></script>
  </body>
</html>
