<!doctype html>
<html lang="en" class="is-booting">
  <head>
    <link rel="icon" type="image/png" href="./imgs/outrun-logo-mark.png" />
    <meta charset="utf-8" />
    <title>Outrun — Global Climate-Pressure & Corridor Platform for Migratory Birds</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#efe9dd" />
    <meta
      name="description"
      content="Outrun: A global climate-pressure and corridor platform for migratory birds (class Aves). Tracking climate velocity, seasonal habitat shifts, and critical migratory corridors."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link href="https://unpkg.com/maplibre-gl@4.5.2/dist/maplibre-gl.css" rel="stylesheet" />
    <!-- Loading screen: painted before the app bundle arrives; src/bootLoader.js drives it. -->
    <style>
      html.is-booting, html.is-booting body { overflow: hidden; }
      #boot {
        position: fixed; inset: 0; z-index: 10000;
        display: grid; place-items: center;
        background: radial-gradient(900px 600px at 50% 38%, #f6f1e6 0%, #ebe4d6 60%, #e2d9c7 100%);
        color: #16181d;
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition: opacity 520ms cubic-bezier(0.22, 1, 0.36, 1), visibility 0s linear 520ms;
      }
      #boot.is-done { opacity: 0; visibility: hidden; }
      #boot .boot__inner { display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 24px; text-align: center; }
      #boot .boot__stage { position: relative; width: 148px; height: 148px; }
      #boot .boot__ring { position: absolute; inset: 0; transform: rotate(-90deg); }
      #boot .boot__ring circle { fill: none; stroke-width: 3; }
      #boot .boot__track { stroke: rgba(22, 24, 29, 0.1); }
      #boot #boot-ring { stroke: #16181d; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; transition: stroke-dashoffset 480ms cubic-bezier(0.22, 1, 0.36, 1); }
      #boot .boot__logo { position: absolute; inset: 30px; border-radius: 18px; overflow: hidden; box-shadow: 0 10px 30px rgba(22, 24, 29, 0.18); }
      #boot .boot__logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
      #boot .boot__orbit { position: absolute; inset: -10px; animation: boot-orbit 3.2s linear infinite; }
      #boot .boot__orbit svg { position: absolute; top: 0; left: 50%; width: 26px; height: 12px; transform: translate(-50%, -2px); fill: #16181d; }
      #boot .boot__orbit svg path { animation: boot-flap 0.5s ease-in-out infinite alternate; transform-origin: 50% 70%; }
      #boot .boot__title { font: 800 22px/1 Outfit, Inter, system-ui, sans-serif; letter-spacing: 0.32em; padding-left: 0.32em; }
      #boot .boot__sub { margin-top: 6px; font-size: 13px; color: #4e5563; }
      #boot .boot__status { display: flex; align-items: center; gap: 10px; min-height: 20px; font: 500 12px/1 'JetBrains Mono', ui-monospace, Consolas, monospace; color: #4e5563; }
      #boot #boot-pct { color: #16181d; font-weight: 600; }
      @keyframes boot-orbit { to { transform: rotate(360deg); } }
      @keyframes boot-flap { from { transform: scaleY(1); } to { transform: scaleY(0.55); } }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot__orbit, #boot .boot__orbit svg path { animation: none; }
        #boot, #boot #boot-ring { transition: none; }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run Outrun.</noscript>
    <div id="boot" role="progressbar" aria-label="Loading Outrun" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="boot__inner">
        <div class="boot__stage">
          <svg class="boot__ring" viewBox="0 0 100 100" aria-hidden="true">
            <circle class="boot__track" cx="50" cy="50" r="46" pathLength="100" />
            <circle id="boot-ring" cx="50" cy="50" r="46" pathLength="100" />
          </svg>
          <div class="boot__orbit" aria-hidden="true">
            <svg viewBox="0 0 64 28"><path d="M1 17 C 10 11, 19 9, 27 13 C 30 7, 38 2, 54 2 C 45 5, 39 10, 36 16 C 35 18, 33 19, 31 19 L 29 22 L 27 19 C 20 16, 11 15, 1 17 Z" /></svg>
          </div>
          <div class="boot__logo"><img src="./imgs/outrun-logo-mark.png" alt="" /></div>
        </div>
        <div>
          <div class="boot__title">OUTRUN</div>
          <div class="boot__sub">Migratory flyway observatory</div>
        </div>
        <div class="boot__status"><span id="boot-step">Starting…</span><span id="boot-pct">0%</span></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="./src/index.jsx"></script>
  </body>
</html>
